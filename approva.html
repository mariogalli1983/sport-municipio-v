<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderazione | SPORT V</title>

  <style>
    :root {
      --blu: #123c69;
      --blu-scuro: #0b2949;
      --verde: #2b8a66;
      --rosso: #b93838;
      --testo: #1c2630;
      --grigio: #66717d;
      --sfondo: #f5f7f9;
      --bordo: #dfe5ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--sfondo);
      color: var(--testo);
      line-height: 1.5;
    }

    header {
      background: var(--blu-scuro);
      color: white;
      padding: 20px 16px;
    }

    .header-inner,
    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
    }

    .brand {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .brand span { color: #75d0a7; }

    .header-subtitle {
      margin-top: 4px;
      color: rgba(255,255,255,.75);
      font-size: 14px;
    }

    main { padding: 32px 0 60px; }

    .panel {
      background: white;
      border: 1px solid var(--bordo);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(20,40,60,.08);
    }

    .panel-head {
      padding: 24px;
      border-bottom: 1px solid var(--bordo);
    }

    .eyebrow {
      color: var(--verde);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 7px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 36px);
      line-height: 1.1;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--grigio);
    }

    .panel-body { padding: 24px; }

    .status {
      padding: 13px 15px;
      border-radius: 10px;
      margin-bottom: 22px;
      font-weight: 800;
    }

    .status.loading {
      background: #eaf4ff;
      color: var(--blu);
    }

    .status.pending {
      background: #fff4df;
      color: #8b5716;
    }

    .status.success {
      background: #e6f5ee;
      color: #176044;
    }

    .status.error {
      background: #fdeaea;
      color: #8f2f2f;
    }

    .asd-box {
      background: #eaf4ff;
      color: var(--blu);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .data-table th,
    .data-table td {
      padding: 11px 10px;
      border-bottom: 1px solid #e8edf1;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    .data-table th {
      width: 32%;
      color: var(--grigio);
      font-size: 12px;
      text-transform: uppercase;
    }

    .section-title {
      margin: 30px 0 13px;
      color: var(--blu-scuro);
      font-size: 21px;
    }

    .poster-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .poster-card {
      margin: 0;
      border: 1px solid var(--bordo);
      border-radius: 13px;
      overflow: hidden;
      background: #f7f8fa;
    }

    .poster-card a {
      display: block;
      background: #f1f3f5;
    }

    .poster-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .poster-card figcaption {
      padding: 10px 12px;
      color: var(--grigio);
      font-size: 13px;
      font-weight: 700;
      background: white;
    }

    .logo-preview {
      width: min(280px, 100%);
      border: 1px solid var(--bordo);
      border-radius: 13px;
      padding: 12px;
      background: white;
    }

    .logo-preview img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--bordo);
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-approve {
      background: var(--verde);
      color: white;
    }

    .btn-secondary {
      background: #edf2f6;
      color: var(--blu);
    }

    .btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .notify-box {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #cfe6da;
      border-radius: 12px;
      background: #f1faf6;
      color: #176044;
    }

    .notify-box strong {
      display: block;
      margin-bottom: 5px;
      color: #176044;
    }

    .notify-box p {
      margin: 0 0 12px;
      color: #46695a;
      font-size: 14px;
    }

    .btn-notify {
      background: #123c69;
      color: white;
    }

    .hidden { display: none !important; }

    @media (max-width: 700px) {
      .poster-grid { grid-template-columns: 1fr; }
      .panel-head, .panel-body { padding: 19px; }
      .data-table th { width: 38%; }
      .actions .btn { width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand">SPORT <span>V</span></div>
      <div class="header-subtitle">Area di moderazione</div>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-head">
        <div class="eyebrow">Richiesta da verificare</div>
        <h1 id="pageTitle">Caricamento richiesta...</h1>
        <p id="pageSubtitle" class="subtitle">
          Controlla tutte le informazioni prima di pubblicare.
        </p>
      </div>

      <div class="panel-body">
        <div id="statusBox" class="status loading">
          Recupero i dati della richiesta...
        </div>

        <div id="requestContent" class="hidden">
          <div id="asdBox" class="asd-box hidden"></div>

          <table class="data-table">
            <tbody id="dataRows"></tbody>
          </table>

          <div id="mediaArea"></div>

          <div class="actions">
            <button id="approveButton" class="btn btn-approve" type="button">
              ✅ CONFERMA PUBBLICAZIONE
            </button>

            <a
              class="btn btn-secondary"
              href="https://mariogalli1983.github.io/sport-municipio-v/"
            >
              Apri SPORT V
            </a>
          </div>

          <div id="notifyBox" class="notify-box hidden">
            <strong>Pubblicazione completata</strong>
            <p id="notifyText">
              Puoi avvisare via email il referente che ha inviato la richiesta.
            </p>
            <button id="notifyButton" class="btn btn-notify" type="button">
              ✉️ NOTIFICA IL REFERENTE
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://yordjsaevwflqakzhfdf.supabase.co";

    const SITE_URL =
      "https://mariogalli1983.github.io/sport-municipio-v/";

    const params = new URLSearchParams(window.location.search);

    const type = params.get("type") || "";
    const id = params.get("id") || "";
    const exp = params.get("exp") || "";
    const token = params.get("token") || "";

    const apiParams = new URLSearchParams({
      type,
      id,
      exp,
      token
    });

    const API_URL =
      `${SUPABASE_URL}/functions/v1/approve-submission?${apiParams.toString()}`;

    let currentRecord = null;

    const labels = {
      id: "ID",
      created_at: "Data invio",
      nome: "Nome ASD",
      descrizione: "Descrizione",
      discipline: "Discipline",
      indirizzo: "Indirizzo",
      quartiere: "Quartiere",
      latitudine: "Latitudine",
      longitudine: "Longitudine",
      telefono_pubblico: "Telefono pubblico",
      email_pubblica: "Email pubblica",
      sito_web: "Sito web",
      instagram: "Instagram",
      facebook: "Facebook",
      nome_referente: "Nome referente",
      email_referente: "Email referente",
      asd_id: "ID ASD",
      titolo: "Titolo",
      tipologia: "Tipologia",
      data_inizio: "Data e ora inizio",
      data_fine: "Data e ora fine",
      luogo: "Luogo",
      pubblico: "Pubblico",
      prezzo: "Prezzo / offerta",
      link_info: "Link informazioni"
    };

    const eventOrder = [
      "id",
      "created_at",
      "titolo",
      "tipologia",
      "descrizione",
      "data_inizio",
      "data_fine",
      "luogo",
      "indirizzo",
      "pubblico",
      "prezzo",
      "link_info",
      "nome_referente",
      "email_referente",
      "asd_id"
    ];

    const asdOrder = [
      "id",
      "created_at",
      "nome",
      "discipline",
      "descrizione",
      "quartiere",
      "indirizzo",
      "latitudine",
      "longitudine",
      "telefono_pubblico",
      "email_pubblica",
      "sito_web",
      "instagram",
      "facebook",
      "nome_referente",
      "email_referente"
    ];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeHttpUrl(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";

      try {
        const url = new URL(raw);
        return url.protocol === "http:" || url.protocol === "https:"
          ? url.href
          : "";
      } catch (_) {
        return "";
      }
    }

    function formatValue(key, value) {
      if (value === null || value === undefined || value === "") {
        return "—";
      }

      if (
        key === "created_at" ||
        key === "data_inizio" ||
        key === "data_fine"
      ) {
        const date = new Date(value);
        if (!Number.isNaN(date.getTime())) {
          return new Intl.DateTimeFormat("it-IT", {
            dateStyle: "medium",
            timeStyle: "short"
          }).format(date);
        }
      }

      if (typeof value === "boolean") {
        return value ? "Sì" : "No";
      }

      return String(value);
    }

    function getPosterUrls(record) {
      const urls = [];

      const add = (value) => {
        const url = safeHttpUrl(value);
        if (url && !urls.includes(url)) {
          urls.push(url);
        }
      };

      if (Array.isArray(record.locandine_urls)) {
        record.locandine_urls.forEach(add);
      } else if (typeof record.locandine_urls === "string") {
        const raw = record.locandine_urls.trim();

        if (raw.startsWith("[") && raw.endsWith("]")) {
          try {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) parsed.forEach(add);
          } catch (_) {}
        } else if (raw.startsWith("{") && raw.endsWith("}")) {
          raw
            .slice(1, -1)
            .split(",")
            .map((item) => item.trim().replace(/^"|"$/g, ""))
            .forEach(add);
        } else {
          add(raw);
        }
      }

      add(record.locandina_url);

      return urls;
    }

    function renderRows(record, type) {
      const tbody = document.getElementById("dataRows");
      const order = type === "evento" ? eventOrder : asdOrder;

      tbody.innerHTML = order
        .filter((key) => Object.prototype.hasOwnProperty.call(record, key))
        .map((key) => `
          <tr>
            <th>${escapeHtml(labels[key] || key)}</th>
            <td>${escapeHtml(formatValue(key, record[key]))}</td>
          </tr>
        `)
        .join("");
    }

    function renderEventPosters(record) {
      const mediaArea = document.getElementById("mediaArea");
      const urls = getPosterUrls(record);

      if (urls.length === 0) {
        mediaArea.innerHTML = "";
        return;
      }

      mediaArea.innerHTML = `
        <h2 class="section-title">
          ${urls.length === 1 ? "Locandina" : `Locandine (${urls.length})`}
        </h2>

        <div class="poster-grid">
          ${urls.map((url, index) => `
            <figure class="poster-card">
              <a
                href="${escapeHtml(url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  src="${escapeHtml(url)}"
                  alt="Locandina ${index + 1}"
                >
              </a>
              <figcaption>Locandina ${index + 1}</figcaption>
            </figure>
          `).join("")}
        </div>
      `;
    }

    function renderAsdLogo(record) {
      const mediaArea = document.getElementById("mediaArea");
      const logoUrl = safeHttpUrl(record.logo_url);

      if (!logoUrl) {
        mediaArea.innerHTML = "";
        return;
      }

      mediaArea.innerHTML = `
        <h2 class="section-title">Logo ASD</h2>
        <div class="logo-preview">
          <a
            href="${escapeHtml(logoUrl)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="${escapeHtml(logoUrl)}" alt="Logo ASD">
          </a>
        </div>
      `;
    }

    function safeEmail(value) {
      const email = String(value || "").trim();
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
        ? email
        : "";
    }

    function getPublishedUrl(record) {
      const url = new URL(SITE_URL);

      if (type === "evento") {
        url.searchParams.set("evento", String(record.id));
        url.hash = "eventi";
      } else {
        url.searchParams.set("asd", String(record.id));
        url.hash = "mappa";
      }

      return url.href;
    }

    function buildNotificationMailto(record) {
      const email = safeEmail(record?.email_referente);
      if (!email) return "";

      const name = String(record?.nome_referente || "").trim();
      const title = type === "evento"
        ? String(record?.titolo || "evento").trim()
        : String(record?.nome || "ASD").trim();

      const publishedUrl = getPublishedUrl(record);

      const subject = type === "evento"
        ? `SPORT V — Il tuo evento è stato pubblicato: ${title}`
        : `SPORT V — La tua ASD è stata pubblicata: ${title}`;

      const greeting = name ? `Ciao ${name},` : "Ciao,";

      const body = type === "evento"
        ? `${greeting}\n\nla richiesta di pubblicazione dell'evento "${title}" è stata verificata e pubblicata su SPORT V.\n\nPuoi vedere la scheda qui:\n${publishedUrl}\n\nGrazie per aver contribuito a SPORT V.\n\nMario Galli\nSPORT V`
        : `${greeting}\n\nla richiesta di inserimento di "${title}" è stata verificata e pubblicata su SPORT V.\n\nPuoi vedere la scheda qui:\n${publishedUrl}\n\nDa questo momento puoi anche proporre corsi, open day, tornei ed eventi collegati alla tua associazione.\n\nGrazie per aver contribuito a SPORT V.\n\nMario Galli\nSPORT V`;

      return (
        `mailto:${encodeURIComponent(email)}`
        + `?subject=${encodeURIComponent(subject)}`
        + `&body=${encodeURIComponent(body)}`
      );
    }

    function updateNotificationArea(record, published) {
      const box = document.getElementById("notifyBox");
      const button = document.getElementById("notifyButton");
      const text = document.getElementById("notifyText");
      const email = safeEmail(record?.email_referente);

      if (!published || !email) {
        box.classList.add("hidden");
        return;
      }

      text.textContent =
        `Puoi avvisare ${record.nome_referente ? record.nome_referente + " " : "il referente "}all'indirizzo ${email}.`;

      button.onclick = () => {
        const mailto = buildNotificationMailto(record);
        if (mailto) window.location.href = mailto;
      };

      box.classList.remove("hidden");
    }

    function setStatus(kind, text) {
      const box = document.getElementById("statusBox");
      box.className = `status ${kind}`;
      box.textContent = text;
    }

    async function loadRequest() {
      if (!type || !id || !exp || !token) {
        setStatus("error", "Link di moderazione incompleto o non valido.");
        document.getElementById("pageTitle").textContent =
          "Impossibile aprire la richiesta";
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: "GET"
        });

        let data = {};
        try {
          data = await response.json();
        } catch (_) {}

        if (!response.ok || !data.ok || !data.record) {
          const detail = data.error || data.message || "Impossibile recuperare la richiesta.";
          setStatus("error", detail);
          document.getElementById("pageTitle").textContent =
            "Impossibile recuperare la richiesta";
          return;
        }

        const record = data.record;
        currentRecord = record;
        const isEvent = type === "evento";

        document.getElementById("pageTitle").textContent =
          isEvent
            ? (record.titolo || "Evento senza titolo")
            : (record.nome || "ASD senza nome");

        document.getElementById("pageSubtitle").textContent =
          isEvent
            ? "Controlla dati e tutte le locandine prima di pubblicare l'evento."
            : "Controlla i dati prima di pubblicare l'associazione.";

        if (isEvent && data.asd_name) {
          const asdBox = document.getElementById("asdBox");
          asdBox.textContent = `ASD organizzatrice: ${data.asd_name}`;
          asdBox.classList.remove("hidden");
        }

        renderRows(record, type);

        if (isEvent) {
          renderEventPosters(record);
        } else {
          renderAsdLogo(record);
        }

        document.getElementById("requestContent").classList.remove("hidden");

        const approveButton = document.getElementById("approveButton");

        if (data.approved) {
          setStatus("success", "Questa richiesta è già stata pubblicata.");
          approveButton.disabled = true;
          approveButton.textContent = "✓ GIÀ PUBBLICATO";
          updateNotificationArea(record, true);
        } else {
          setStatus("pending", "Richiesta in attesa di approvazione.");
          updateNotificationArea(record, false);
        }
      } catch (error) {
        console.error(error);
        setStatus("error", "Errore di rete durante il recupero della richiesta.");
        document.getElementById("pageTitle").textContent =
          "Errore di collegamento";
      }
    }

    document
      .getElementById("approveButton")
      .addEventListener("click", async () => {
        const confirmed = window.confirm(
          type === "evento"
            ? "Confermi la pubblicazione di questo evento?"
            : "Confermi la pubblicazione di questa ASD?"
        );

        if (!confirmed) return;

        const button = document.getElementById("approveButton");
        button.disabled = true;
        button.textContent = "Pubblicazione in corso...";

        try {
          const response = await fetch(API_URL, {
            method: "POST"
          });

          let data = {};
          try {
            data = await response.json();
          } catch (_) {}

          if (!response.ok || !data.ok) {
            throw new Error(
              data.error || data.message || "Pubblicazione non riuscita."
            );
          }

          setStatus(
            "success",
            type === "evento"
              ? "Evento pubblicato correttamente su SPORT V."
              : "ASD pubblicata correttamente su SPORT V."
          );

          button.textContent = "✓ PUBBLICATO";
          button.disabled = true;

          if (currentRecord) {
            updateNotificationArea(currentRecord, true);
          }

          const siteLink = document.querySelector('.btn-secondary');
          if (siteLink) siteLink.href = SITE_URL;
        } catch (error) {
          console.error(error);
          setStatus(
            "error",
            error instanceof Error
              ? error.message
              : "Pubblicazione non riuscita."
          );

          button.disabled = false;
          button.textContent = "✅ CONFERMA PUBBLICAZIONE";
        }
      });

    loadRequest();
  </script>
</body>
</html>
